// 简易程序音效(WebAudio,无需外部资源 — 需求 6)

class Sfx {
  constructor() {
    this.ctx = null;
  }
  ensure() {
    if (!this.ctx) {
      try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {}
    }
    if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
    return this.ctx;
  }
  hit(intensity = 1) {
    const ctx = this.ensure(); if (!ctx) return;
    const t0 = ctx.currentTime;
    // 低频"咚"
    const o1 = ctx.createOscillator(); const g1 = ctx.createGain();
    o1.type = 'sine'; o1.frequency.setValueAtTime(120, t0); o1.frequency.exponentialRampToValueAtTime(40, t0 + 0.2);
    g1.gain.setValueAtTime(0.6 * intensity, t0); g1.gain.exponentialRampToValueAtTime(0.001, t0 + 0.25);
    o1.connect(g1).connect(ctx.destination); o1.start(t0); o1.stop(t0 + 0.3);
    // 高频脆响(刀刃/骨头)
    const buf = ctx.createBuffer(1, 4410, 44100);
    const d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / d.length, 2);
    const src = ctx.createBufferSource(); src.buffer = buf;
    const filter = ctx.createBiquadFilter(); filter.type = 'highpass'; filter.frequency.value = 1500;
    const g2 = ctx.createGain(); g2.gain.value = 0.4 * intensity;
    src.connect(filter).connect(g2).connect(ctx.destination); src.start(t0);
  }
  swing() {
    const ctx = this.ensure(); if (!ctx) return;
    const t0 = ctx.currentTime;
    const buf = ctx.createBuffer(1, 8800, 44100);
    const d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / d.length, 1.5) * 0.3;
    const src = ctx.createBufferSource(); src.buffer = buf;
    const filter = ctx.createBiquadFilter(); filter.type = 'bandpass'; filter.frequency.value = 800;
    const g = ctx.createGain(); g.gain.value = 0.5;
    src.connect(filter).connect(g).connect(ctx.destination); src.start(t0);
  }
  grunt() {
    const ctx = this.ensure(); if (!ctx) return;
    const t0 = ctx.currentTime;
    const o = ctx.createOscillator(); const g = ctx.createGain();
    o.type = 'sawtooth';
    o.frequency.setValueAtTime(180 + Math.random() * 40, t0);
    o.frequency.exponentialRampToValueAtTime(80, t0 + 0.4);
    g.gain.setValueAtTime(0.3, t0); g.gain.exponentialRampToValueAtTime(0.001, t0 + 0.4);
    const filter = ctx.createBiquadFilter(); filter.type = 'lowpass'; filter.frequency.value = 800;
    o.connect(filter).connect(g).connect(ctx.destination);
    o.start(t0); o.stop(t0 + 0.45);
  }
}

// ==========================================================
// 网络层 — 自建信令(Firebase Realtime DB)+ 原生 WebRTC

// 默认 Firebase 配置(可在大厅"⚙ 配置"里覆盖,存入 localStorage)
const DEFAULT_FIREBASE_URL = 'https://blade-duel-2026-default-rtdb.asia-southeast1.firebasedatabase.app';

function getFirebaseURL() {
  const saved = localStorage.getItem('blade_duel_fb_url');
  if (saved && saved.startsWith('http')) return saved.replace(/\/$/, '');
  // 也支持 URL hash 上传配置 #fb=https://xxx
  const m = location.hash.match(/[#&]fb=([^&]+)/);
  if (m) {
    const url = decodeURIComponent(m[1]);
    localStorage.setItem('blade_duel_fb_url', url);
    return url.replace(/\/$/, '');
  }
  return DEFAULT_FIREBASE_URL;
}

const ICE_SERVERS = [
  { urls: 'stun:stun.l.google.com:19302' },
  { urls: 'stun:stun1.l.google.com:19302' },
  { urls: 'stun:stun.cloudflare.com:3478' },
  { urls: 'stun:global.stun.twilio.com:3478' },
  { urls: 'turn:openrelay.metered.ca:80', username: 'openrelayproject', credential: 'openrelayproject' },
  { urls: 'turn:openrelay.metered.ca:443', username: 'openrelayproject', credential: 'openrelayproject' },
  { urls: 'turn:openrelay.metered.ca:443?transport=tcp', username: 'openrelayproject', credential: 'openrelayproject' },

// Firebase REST 信令封装
class Signaling {
  constructor(roomId) {
    this.roomId = roomId;
    this.base = getFirebaseURL() + '/rooms/' + roomId;
    this.pollers = [];
  }
  async _put(path, value) {
    return fetch(this.base + path + '.json', {
      method: 'PUT', body: JSON.stringify(value),
    }).then(r => r.json());
  }
  async _patch(path, value) {
    return fetch(this.base + path + '.json', {
      method: 'PATCH', body: JSON.stringify(value),
    }).then(r => r.json());
  }
  async _post(path, value) {
    return fetch(this.base + path + '.json', {
      method: 'POST', body: JSON.stringify(value),
    }).then(r => r.json());
  }
  async _get(path) {
    return fetch(this.base + path + '.json').then(r => r.json());
  }
  async _delete(path) {
    return fetch(this.base + path + '.json', { method: 'DELETE' });
  }
  // 轮询某个路径直到出现非 null 值或超时
  poll(path, cb, intervalMs = 1500) {
    let stopped = false;
    const seen = new Set();
    const tick = async () => {
      if (stopped) return;
      try {
        const data = await this._get(path);
        if (data) {
          if (Array.isArray(data) || typeof data === 'object') {
            for (const k in data) {
              if (data[k] && !seen.has(k)) {
                seen.add(k);
                cb(data[k], k);
              }
            }
          } else {
            if (!seen.has('__single')) {
              seen.add('__single');
              cb(data);
            }
          }
        }
      } catch (e) { console.warn('[Sig] poll err', e); }
      setTimeout(tick, intervalMs);
    };
    tick();
    const stop = () => { stopped = true; };
    this.pollers.push(stop);
    return stop;
  }
  cleanupPollers() { this.pollers.forEach(s => s()); this.pollers = []; }
  async destroyRoom() { try { await this._delete(''); } catch (e) {} }
}

class Net {
  constructor() {
    this.pc = null;
    this.dc = null;
    this.sig = null;
    this.isHost = false;
    this.roomId = null;
    this.onOpen = () => {};
    this.onData = () => {};
    this.onClose = () => {};
    this.onState = () => {};
  }

  _newPC() {
    const pc = new RTCPeerConnection({ iceServers: ICE_SERVERS });
    pc.addEventListener('iceconnectionstatechange', () => {
      console.log('[Net] iceState=', pc.iceConnectionState);
      this.onState(pc.iceConnectionState);
      if (pc.iceConnectionState === 'failed' || pc.iceConnectionState === 'disconnected') {
        // 不立刻关闭,disconnected 可能短暂恢复
      }
      if (pc.iceConnectionState === 'closed') this.onClose();
    });
    pc.addEventListener('connectionstatechange', () => console.log('[Net] connState=', pc.connectionState));
    return pc;
  }
  _wireDC(dc) {
    this.dc = dc;
    dc.binaryType = 'arraybuffer';
    dc.addEventListener('open', () => { console.log('[Net] DC open'); this.onOpen(); });
    dc.addEventListener('message', (e) => {
      try { this.onData(JSON.parse(e.data)); } catch (err) {}
    });
    dc.addEventListener('close', () => { console.log('[Net] DC close'); this.onClose(); });
    dc.addEventListener('error', (e) => console.warn('[Net] DC error', e));
  }

  async host() {
    this.isHost = true;
    this.roomId = 'bd-' + Math.random().toString(36).slice(2, 8);
    this.sig = new Signaling(this.roomId);
    console.log('[Net] host roomId=', this.roomId);

    this.pc = this._newPC();
    // 房主创建 DataChannel
    const dc = this.pc.createDataChannel('game', { ordered: false, maxRetransmits: 0 });
    this._wireDC(dc);

    // 收集 ICE 候选并写入 host_ice
    this.pc.addEventListener('icecandidate', async (ev) => {
      if (ev.candidate) {
        await this.sig._post('/host_ice', ev.candidate.toJSON());
      }
    });

    // 创建 offer
    const offer = await this.pc.createOffer();
    await this.pc.setLocalDescription(offer);
    await this.sig._put('/offer', { type: offer.type, sdp: offer.sdp, ts: Date.now() });

    // 等待 answer + 访客 ICE
    this.sig.poll('/answer', async (ans) => {
      if (!this.pc.currentRemoteDescription) {
        console.log('[Net] got answer');
        await this.pc.setRemoteDescription(new RTCSessionDescription(ans));
      }
    }, 1200);
    this.sig.poll('/guest_ice', async (cand) => {
      try { await this.pc.addIceCandidate(new RTCIceCandidate(cand)); } catch (e) { console.warn('[Net] addIce err', e); }
    }, 1200);

    return this.roomId;
  }

  async join(roomId) {
    this.isHost = false;
    this.roomId = roomId;
    this.sig = new Signaling(roomId);
    console.log('[Net] join roomId=', roomId);

    // 取 offer(可能要等房主写入)
    const startTs = Date.now();
    let offer = null;
    while (Date.now() - startTs < 25000) {
      offer = await this.sig._get('/offer');
      if (offer && offer.sdp) break;
      await new Promise(r => setTimeout(r, 800));
    }
    if (!offer || !offer.sdp) throw new Error('找不到房间(房主未在线或链接错误)');

    this.pc = this._newPC();
    this.pc.addEventListener('datachannel', (ev) => this._wireDC(ev.channel));
    this.pc.addEventListener('icecandidate', async (ev) => {
      if (ev.candidate) await this.sig._post('/guest_ice', ev.candidate.toJSON());
    });

    await this.pc.setRemoteDescription(new RTCSessionDescription(offer));
    const ans = await this.pc.createAnswer();
    await this.pc.setLocalDescription(ans);
    await this.sig._put('/answer', { type: ans.type, sdp: ans.sdp, ts: Date.now() });

    this.sig.poll('/host_ice', async (cand) => {
      try { await this.pc.addIceCandidate(new RTCIceCandidate(cand)); } catch (e) { console.warn('[Net] addIce err', e); }
    }, 1200);

    // 等 DC 打开,30 秒超时
    return new Promise((resolve, reject) => {
      const t = setTimeout(() => reject(new Error('P2P 通道未建立(可能被防火墙拦截)')), 30000);
      const origOpen = this.onOpen;
      this.onOpen = () => { clearTimeout(t); origOpen(); resolve(); };
    });
  }

  send(o) {
    if (this.dc && this.dc.readyState === 'open') {
      try { this.dc.send(JSON.stringify(o)); } catch (e) {}
    }
  }
}

// 场景:中世纪角斗场(需求 4)

function buildArena(scene, world) {
  // 沙地
  const sandTex = makeNoiseTexture(0xc8a070, 0xa07840, 256);
  const ground = new THREE.Mesh(
    new THREE.CircleGeometry(ARENA_R, 64),
    new THREE.MeshStandardMaterial({ map: sandTex, roughness: 0.95 })
  );
  ground.rotation.x = -Math.PI / 2;
  ground.receiveShadow = true;
  scene.add(ground);

  // 物理地面
  const groundBody = new CANNON.Body({ mass: 0, shape: new CANNON.Plane() });
  groundBody.quaternion.setFromAxisAngle(new CANNON.Vec3(1, 0, 0), -Math.PI / 2);
  groundBody.userData = { type: 'ground' };
  world.addBody(groundBody);

  // 石砌外墙(分块拼接)
  const wallH = 4.5;
  const wallTex = makeNoiseTexture(0x8a7a66, 0x5a4a36, 512);
  wallTex.wrapS = wallTex.wrapT = THREE.RepeatWrapping;
  wallTex.repeat.set(8, 1);
  const wallMat = new THREE.MeshStandardMaterial({ map: wallTex, roughness: 0.9 });
  const segments = 32;
  for (let i = 0; i < segments; i++) {
    const a = (i / segments) * Math.PI * 2;
    const r = ARENA_R + 0.4;
    const px = Math.cos(a) * r, pz = Math.sin(a) * r;
    const segLen = (Math.PI * 2 * r) / segments + 0.1;
    const block = new THREE.Mesh(
      new THREE.BoxGeometry(segLen, wallH, 0.8),
      wallMat
    );
    block.position.set(px, wallH / 2, pz);
    block.lookAt(0, wallH / 2, 0);
    block.rotateY(Math.PI / 2);
    block.castShadow = true; block.receiveShadow = true;
    scene.add(block);

    const body = new CANNON.Body({ mass: 0, shape: new CANNON.Box(new CANNON.Vec3(segLen / 2, wallH / 2, 0.4)) });
    body.position.set(px, wallH / 2, pz);
    body.quaternion.copy(block.quaternion);
    world.addBody(body);
  }

  // 看台剪影(高墙背后的环形)
  for (let i = 0; i < segments; i += 2) {
    const a = (i / segments) * Math.PI * 2;
    const r = ARENA_R + 1.6;
    const tier = new THREE.Mesh(
      new THREE.BoxGeometry(2.5, 2.5, 1.2),
      new THREE.MeshStandardMaterial({ color: 0x3a2a1c, roughness: 1 })
    );
    tier.position.set(Math.cos(a) * r, wallH + 1.0, Math.sin(a) * r);
    tier.lookAt(0, tier.position.y, 0);
    scene.add(tier);
  }

  // 拱门 / 入口标志
  for (let k = 0; k < 4; k++) {
    const a = (k / 4) * Math.PI * 2;
    const r = ARENA_R + 0.6;
    const arch = new THREE.Mesh(
      new THREE.TorusGeometry(1.3, 0.18, 8, 24, Math.PI),
      new THREE.MeshStandardMaterial({ color: 0x6a5a44 })
    );
    arch.position.set(Math.cos(a) * r, 2.2, Math.sin(a) * r);
    arch.lookAt(0, 2.2, 0);
    arch.rotateX(Math.PI / 2);
    scene.add(arch);
  }

  // 火把(8 个)
  for (let i = 0; i < 8; i++) {
    const a = (i / 8) * Math.PI * 2 + Math.PI / 16;
    const r = ARENA_R - 0.3;
    const px = Math.cos(a) * r, pz = Math.sin(a) * r;
    const torch = new THREE.Mesh(
      new THREE.CylinderGeometry(0.1, 0.14, 2.6),
      new THREE.MeshStandardMaterial({ color: 0x3a2010 })
    );
    torch.position.set(px, 1.3, pz);
    torch.castShadow = true;
    scene.add(torch);
    const fire = new THREE.PointLight(0xff8030, 1.6, 10);
    fire.position.set(px, 2.7, pz);
    scene.add(fire);
    const ball = new THREE.Mesh(
      new THREE.SphereGeometry(0.22, 12, 12),
      new THREE.MeshBasicMaterial({ color: 0xffaa40 })
    );
    ball.position.copy(fire.position);
    ball.userData.flicker = fire;
    scene.add(ball);
  }

  // 中心地面图案(角斗士印记)
  const center = new THREE.Mesh(
    new THREE.RingGeometry(2.5, 3, 32),
    new THREE.MeshStandardMaterial({ color: 0x4a3020, roughness: 1, transparent: true, opacity: 0.6 })
  );
  center.rotation.x = -Math.PI / 2;
  center.position.y = 0.02;
  scene.add(center);

  // 远景天空圆顶
  scene.background = new THREE.Color(0x0a0608);
  scene.fog = new THREE.Fog(0x1a1008, 12, 40);
}

function makeNoiseTexture(c1, c2, size) {
  const cv = document.createElement('canvas');
  cv.width = cv.height = size;
  const g = cv.getContext('2d');
  const a = new THREE.Color(c1), b = new THREE.Color(c2);
  const img = g.createImageData(size, size);
  for (let i = 0; i < size * size; i++) {
    const t = Math.random() * 0.7 + 0.3;
    const r = a.r * t + b.r * (1 - t);
    const gg = a.g * t + b.g * (1 - t);
    const bb = a.b * t + b.b * (1 - t);
    img.data[i * 4] = r * 255;
    img.data[i * 4 + 1] = gg * 255;
    img.data[i * 4 + 2] = bb * 255;
    img.data[i * 4 + 3] = 255;
  }
  g.putImageData(img, 0, 0);
  const tex = new THREE.CanvasTexture(cv);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

// ==========================================================
// 流血粒子系统(需求 6)
// ==========================================================
class BloodSystem {
  constructor(scene) {
    this.scene = scene;
    this.particles = [];
    this.geo = new THREE.SphereGeometry(0.05, 6, 6);
    this.mat = new THREE.MeshBasicMaterial({ color: 0x900000 });
  }
  spawn(pos, dir, count = 14, intensity = 1) {
    for (let i = 0; i < count; i++) {
      const m = new THREE.Mesh(this.geo, this.mat);
      m.position.copy(pos);
      this.scene.add(m);
      this.particles.push({
        mesh: m,
        vel: new THREE.Vector3(
          dir.x * 2 + (Math.random() - 0.5) * 4,
          Math.random() * 4 + 1,
          dir.z * 2 + (Math.random() - 0.5) * 4
        ).multiplyScalar(intensity),
        life: 0.6 + Math.random() * 0.4,
        age: 0,
      });
    }
  }
  update(dt) {
    for (let i = this.particles.length - 1; i >= 0; i--) {
      const p = this.particles[i];
      p.age += dt;
      p.vel.y -= 12 * dt;
      p.mesh.position.x += p.vel.x * dt;
      p.mesh.position.y += p.vel.y * dt;
      p.mesh.position.z += p.vel.z * dt;
      if (p.mesh.position.y < 0.05) {
        p.mesh.position.y = 0.05;
        p.vel.set(0, 0, 0);
      }
      if (p.age > p.life) {
        this.scene.remove(p.mesh);
        this.particles.splice(i, 1);
      }
    }
  }
}

// ==========================================================
// 多关节 Ragdoll 玩家(需求 5、7)
// ==========================================================
class Player {
  constructor(game, index, color, weaponKey) {
    this.game = game; this.index = index; this.color = color;
    this.weaponKey = weaponKey; this.weapon = WEAPONS[weaponKey];
    this.hp = MAX_HP; this.dead = false;
    this.lastDamageByPart = {};
    this.lastSwingTime = 0;
    this.facing = 0;
    this.input = { mvx: 0, mvz: 0, yaw: 0, jump: 0, sprint: 0, swing: 0, grab: 0 };

    this.parts = {};      // name -> { body, mesh }
    this.bodies = [];     // 全部刚体
    this.constraints = [];
    this.grabConstraint = null;
    this.grabbedTarget = null;

    const startX = index === 0 ? -4 : 4;
    const startZ = 0;
    const facingY = index === 0 ? 0 : Math.PI;
    this.facing = facingY;

    this._buildRagdoll(startX, startZ, facingY);
    this._buildWeapon(startX, startZ, facingY);
  }

  _addPart(name, geo, mat, shape, mass, pos, partType) {
    const mesh = new THREE.Mesh(geo, mat);
    mesh.castShadow = true;
    this.game.scene.add(mesh);
    const body = new CANNON.Body({ mass, shape, position: new CANNON.Vec3(...pos), linearDamping: 0.1, angularDamping: 0.5 });
    body.userData = { type: 'part', player: this, partType, partName: name };
    this.game.world.addBody(body);
    this.bodies.push(body);
    this.parts[name] = { body, mesh, partType };
    return this.parts[name];
  }

  _connect(a, b, pivotA, pivotB, axisA, axisB, useCone = false) {
    let c;
    if (useCone) {
      c = new CANNON.ConeTwistConstraint(a.body, b.body, {
        pivotA: new CANNON.Vec3(...pivotA),
        pivotB: new CANNON.Vec3(...pivotB),
        axisA: new CANNON.Vec3(...axisA),
        axisB: new CANNON.Vec3(...axisB),
        angle: Math.PI / 2,
        twistAngle: Math.PI / 4,
      });
    } else {
      c = new CANNON.PointToPointConstraint(
        a.body, new CANNON.Vec3(...pivotA),
        b.body, new CANNON.Vec3(...pivotB),
        100
      );
    }
    this.game.world.addConstraint(c);
    this.constraints.push(c);
    return c;
  }

  _buildRagdoll(x, z, facing) {
    const skinMat = new THREE.MeshStandardMaterial({ color: 0xe8c898, roughness: 0.7 });
    const clothMat = new THREE.MeshStandardMaterial({ color: this.color, roughness: 0.6 });
    const bootMat = new THREE.MeshStandardMaterial({ color: 0x3a2010, roughness: 0.8 });

    // 尺寸(单位:米)
    const headR = 0.18;
    const torsoH = 0.55, torsoW = 0.36, torsoD = 0.22;
    const pelvisH = 0.22, pelvisW = 0.34, pelvisD = 0.22;
    const uarmH = 0.32, uarmR = 0.07;
    const larmH = 0.30, larmR = 0.06;
    const ulegH = 0.40, ulegR = 0.09;
    const llegH = 0.40, llegR = 0.08;

    // Y 起始基准(脚底贴地)
    const yFoot = 0;
    const yLleg = yFoot + llegH / 2 + 0.05;
    const yUleg = yLleg + llegH / 2 + ulegH / 2;
    const yPelvis = yUleg + ulegH / 2 + pelvisH / 2;
    const yTorso = yPelvis + pelvisH / 2 + torsoH / 2;
    const yHead = yTorso + torsoH / 2 + headR + 0.04;
    const yUarm = yTorso + torsoH / 2 - uarmH / 2;
    const yLarm = yUarm - uarmH / 2 - larmH / 2;

    // 头
    this._addPart('head',
      new THREE.SphereGeometry(headR, 16, 16), skinMat,
      new CANNON.Sphere(headR), 1.2,
      [x, yHead, z], 'head');
    // 简易眼睛
    const eyeMat = new THREE.MeshBasicMaterial({ color: 0x000 });
    const eyeL = new THREE.Mesh(new THREE.SphereGeometry(0.022), eyeMat);
    const eyeR = new THREE.Mesh(new THREE.SphereGeometry(0.022), eyeMat);
    eyeL.position.set(-0.06, 0.02, headR - 0.02);
    eyeR.position.set(0.06, 0.02, headR - 0.02);
    this.parts.head.mesh.add(eyeL, eyeR);

    // 躯干
    this._addPart('torso',
      new THREE.BoxGeometry(torsoW, torsoH, torsoD), clothMat,
      new CANNON.Box(new CANNON.Vec3(torsoW / 2, torsoH / 2, torsoD / 2)), 4,
      [x, yTorso, z], 'torso');
    // 骨盆
    this._addPart('pelvis',
      new THREE.BoxGeometry(pelvisW, pelvisH, pelvisD), clothMat,
      new CANNON.Box(new CANNON.Vec3(pelvisW / 2, pelvisH / 2, pelvisD / 2)), 3,
      [x, yPelvis, z], 'pelvis');
    // 上臂左右
    this._addPart('uarmL',
      new THREE.CylinderGeometry(uarmR, uarmR * 0.9, uarmH), skinMat,
      new CANNON.Cylinder(uarmR, uarmR * 0.9, uarmH, 8), 0.7,
      [x - torsoW / 2 - uarmR, yUarm, z], 'uarm');
    this._addPart('uarmR',
      new THREE.CylinderGeometry(uarmR, uarmR * 0.9, uarmH), skinMat,
      new CANNON.Cylinder(uarmR, uarmR * 0.9, uarmH, 8), 0.7,
      [x + torsoW / 2 + uarmR, yUarm, z], 'uarm');
    // 前臂
    this._addPart('larmL',
      new THREE.CylinderGeometry(larmR, larmR * 0.85, larmH), skinMat,
      new CANNON.Cylinder(larmR, larmR * 0.85, larmH, 8), 0.5,
      [x - torsoW / 2 - uarmR, yLarm, z], 'larm');
    this._addPart('larmR',
      new THREE.CylinderGeometry(larmR, larmR * 0.85, larmH), skinMat,
      new CANNON.Cylinder(larmR, larmR * 0.85, larmH, 8), 0.5,
      [x + torsoW / 2 + uarmR, yLarm, z], 'larm');
    // 大腿
    this._addPart('ulegL',
      new THREE.CylinderGeometry(ulegR, ulegR * 0.85, ulegH), clothMat,
      new CANNON.Cylinder(ulegR, ulegR * 0.85, ulegH, 8), 1.2,
      [x - 0.1, yUleg, z], 'uleg');
    this._addPart('ulegR',
      new THREE.CylinderGeometry(ulegR, ulegR * 0.85, ulegH), clothMat,
      new CANNON.Cylinder(ulegR, ulegR * 0.85, ulegH, 8), 1.2,
      [x + 0.1, yUleg, z], 'uleg');
    // 小腿
    this._addPart('llegL',
      new THREE.CylinderGeometry(llegR, llegR * 0.8, llegH), bootMat,
      new CANNON.Cylinder(llegR, llegR * 0.8, llegH, 8), 0.9,
      [x - 0.1, yLleg, z], 'lleg');
    this._addPart('llegR',
      new THREE.CylinderGeometry(llegR, llegR * 0.8, llegH), bootMat,
      new CANNON.Cylinder(llegR, llegR * 0.8, llegH, 8), 0.9,
      [x + 0.1, yLleg, z], 'lleg');

    // 关节
    // 头-躯干
    this._connect(this.parts.head, this.parts.torso,
      [0, -headR - 0.02, 0], [0, torsoH / 2 + 0.02, 0]);
    // 躯干-骨盆
    this._connect(this.parts.torso, this.parts.pelvis,
      [0, -torsoH / 2, 0], [0, pelvisH / 2, 0]);
    // 躯干-上臂
    this._connect(this.parts.torso, this.parts.uarmL,
      [-torsoW / 2 - 0.02, torsoH / 2 - uarmR, 0], [0, uarmH / 2, 0]);
    this._connect(this.parts.torso, this.parts.uarmR,
      [torsoW / 2 + 0.02, torsoH / 2 - uarmR, 0], [0, uarmH / 2, 0]);
    // 上臂-前臂
    this._connect(this.parts.uarmL, this.parts.larmL,
      [0, -uarmH / 2, 0], [0, larmH / 2, 0]);
    this._connect(this.parts.uarmR, this.parts.larmR,
      [0, -uarmH / 2, 0], [0, larmH / 2, 0]);
    // 骨盆-大腿
    this._connect(this.parts.pelvis, this.parts.ulegL,
      [-0.1, -pelvisH / 2, 0], [0, ulegH / 2, 0]);
    this._connect(this.parts.pelvis, this.parts.ulegR,
      [0.1, -pelvisH / 2, 0], [0, ulegH / 2, 0]);
    // 大腿-小腿
    this._connect(this.parts.ulegL, this.parts.llegL,
      [0, -ulegH / 2, 0], [0, llegH / 2, 0]);
    this._connect(this.parts.ulegR, this.parts.llegR,
      [0, -ulegH / 2, 0], [0, llegH / 2, 0]);

    // 自身碰撞过滤
    this.bodies.forEach(b => { b.collisionFilterGroup = 1 << (this.index + 1); b.collisionFilterMask = -1; });
    // 同一玩家内部各部位互不碰撞
    const grp = this.bodies[0].collisionFilterGroup;
    this.bodies.forEach(b => { b.collisionFilterMask = ~grp; });

    // 站立力(让 ragdoll 直立 — 在 torso 上施加扶正扭矩)
    this.parts.torso.body.angularDamping = 0.8;
    this.parts.pelvis.body.angularDamping = 0.8;

    // 朝向初始
    if (facing !== 0) {
      const q = new CANNON.Quaternion();
      q.setFromAxisAngle(new CANNON.Vec3(0, 1, 0), facing);
      this.bodies.forEach(b => {
        const offset = b.position.vsub(new CANNON.Vec3(x, b.position.y, z));
        const rotated = new CANNON.Vec3();
        q.vmult(offset, rotated);
        b.position.set(x + rotated.x, b.position.y, z + rotated.z);
        b.quaternion = q.mult(b.quaternion);
      });
    }
  }

  _buildWeapon(x, z, facing) {
    const w = this.weapon;
    const grp = new THREE.Group();

    if (w.isMace) {
      // 钉耙:握把 + 球 + 钉刺
      const grip = new THREE.Mesh(
        new THREE.CylinderGeometry(0.05, 0.05, w.length * 0.7),
        new THREE.MeshStandardMaterial({ color: w.gripColor })
      );
      grip.position.y = w.length * 0.35;
      grp.add(grip);
      const head = new THREE.Mesh(
        new THREE.SphereGeometry(w.width / 2, 12, 12),
        new THREE.MeshStandardMaterial({ color: w.color, metalness: 0.6, roughness: 0.5 })
      );
      head.position.y = w.length * 0.7 + w.width / 2;
      grp.add(head);
      // 钉刺
      for (let i = 0; i < 8; i++) {
        const a = (i / 8) * Math.PI * 2;
        const sp = new THREE.Mesh(
          new THREE.ConeGeometry(0.04, 0.12, 6),
          new THREE.MeshStandardMaterial({ color: 0x808080 })
        );
        sp.position.set(Math.cos(a) * w.width / 2, w.length * 0.7 + w.width / 2, Math.sin(a) * w.width / 2);
        sp.lookAt(sp.position.x * 2, sp.position.y, sp.position.z * 2);
        sp.rotateX(Math.PI / 2);
        grp.add(sp);
      }
    } else {
      const blade = new THREE.Mesh(
        new THREE.BoxGeometry(w.width, w.length * 0.78, w.depth),
        new THREE.MeshStandardMaterial({ color: w.color, metalness: 0.9, roughness: 0.2 })
      );
      blade.position.y = w.length * 0.35;
      grp.add(blade);
      const guard = new THREE.Mesh(
        new THREE.BoxGeometry(0.32, 0.06, 0.12),
        new THREE.MeshStandardMaterial({ color: w.guardColor })
      );
      guard.position.y = -0.05;
      grp.add(guard);
      const grip = new THREE.Mesh(
        new THREE.CylinderGeometry(0.045, 0.045, w.length * 0.18),
        new THREE.MeshStandardMaterial({ color: w.gripColor })
      );
      grip.position.y = -w.length * 0.13;
      grp.add(grip);
    }
    grp.castShadow = true;
    this.weaponMesh = grp;
    this.game.scene.add(grp);

    // 物理武器
    const halfL = w.length / 2;
    const shape = w.isMace
      ? new CANNON.Sphere(w.width / 2)
      : new CANNON.Box(new CANNON.Vec3(w.width / 2, w.length / 2, w.depth / 2));
    this.weaponBody = new CANNON.Body({
      mass: w.mass,
      shape,
      linearDamping: 0.1, angularDamping: 0.2,
    });
    this.weaponBody.userData = { type: 'weapon', player: this };
    const handPart = this.parts.larmR.body;
    this.weaponBody.position.set(handPart.position.x, handPart.position.y - 0.3, handPart.position.z);
    this.game.world.addBody(this.weaponBody);
    this.weaponBody.collisionFilterGroup = handPart.collisionFilterGroup;
    this.weaponBody.collisionFilterMask = ~handPart.collisionFilterGroup; // 不撞自己

    // 握剑约束:右前臂末端 ↔ 武器握把
    const tipLocal = w.isMace ? new CANNON.Vec3(0, -halfL, 0) : new CANNON.Vec3(0, -halfL + 0.05, 0);
    this.gripConstraint = new CANNON.PointToPointConstraint(
      handPart, new CANNON.Vec3(0, -0.15, 0),
      this.weaponBody, tipLocal,
      80
    );
    this.game.world.addConstraint(this.gripConstraint);

    // 盾牌(短剑专属)
    if (w.hasShield) {
      const shield = new THREE.Mesh(
        new THREE.BoxGeometry(0.5, 0.7, 0.06),
        new THREE.MeshStandardMaterial({ color: 0x6a4a30, metalness: 0.4 })
      );
      shield.castShadow = true;
      this.shieldMesh = shield;
      this.game.scene.add(shield);
      this.shieldBody = new CANNON.Body({
        mass: 0.6,
        shape: new CANNON.Box(new CANNON.Vec3(0.25, 0.35, 0.03)),
        linearDamping: 0.2,
      });
      this.shieldBody.userData = { type: 'shield', player: this };
      const handL = this.parts.larmL.body;
      this.shieldBody.position.set(handL.position.x, handL.position.y - 0.3, handL.position.z + 0.1);
      this.game.world.addBody(this.shieldBody);
      this.shieldBody.collisionFilterGroup = handL.collisionFilterGroup;
      this.shieldBody.collisionFilterMask = ~handL.collisionFilterGroup;
      this.shieldConstraint = new CANNON.PointToPointConstraint(
        handL, new CANNON.Vec3(0, -0.15, 0),
        this.shieldBody, new CANNON.Vec3(0, 0.2, 0),
        80
      );
      this.game.world.addConstraint(this.shieldConstraint);
    }
  }

  // 输入应用
  applyInput(dt) {
    if (this.dead) return;

    // 直立扭矩(让躯干维持竖直)
    this._uprightTorque(this.parts.torso.body, 80, 8);
    this._uprightTorque(this.parts.pelvis.body, 60, 6);
    this._uprightTorque(this.parts.head.body, 30, 3);

    // 朝向(yaw)
    this.facing = this.input.yaw || 0;
    this._applyYaw(this.parts.torso.body, this.facing, 50);
    this._applyYaw(this.parts.pelvis.body, this.facing, 40);

    // 移动(以骨盆+躯干水平速度)
    const speed = this.input.sprint ? 6.5 : 4;
    const cosY = Math.cos(this.facing), sinY = Math.sin(this.facing);
    // 输入的 mvx/mvz 是相对角色坐标(z = forward, x = right)
    const wantVx = this.input.mvx * cosY * speed + this.input.mvz * sinY * speed;
    const wantVz = -this.input.mvx * sinY * speed + this.input.mvz * cosY * speed;
    [this.parts.torso.body, this.parts.pelvis.body].forEach(b => {
      b.velocity.x += (wantVx - b.velocity.x) * 0.3;
      b.velocity.z += (wantVz - b.velocity.z) * 0.3;
    });

    // 跳跃(脚底接触地面 + 输入)
    if (this.input.jump) {
      const onGround = this.parts.llegL.body.position.y < 0.32 || this.parts.llegR.body.position.y < 0.32;
      if (onGround) {
        [this.parts.torso.body, this.parts.pelvis.body, this.parts.ulegL.body, this.parts.ulegR.body].forEach(b => {
          b.velocity.y = 6;
        });
      }
      this.input.jump = 0;
    }

    // 挥武器(左键)
    const now = performance.now();
    if (this.input.swing && (now - this.lastSwingTime) > this.weapon.cooldown) {
      this.lastSwingTime = now;
      this._doSwing();
      sfx.swing();
    }
    this._maintainSwing(dt);

    // 持续抓取力(右键持续吸附 — 由外部建立约束,这里只做朝向)
  }

  _uprightTorque(body, kP, kD) {
    // 把刚体的 up 矢量拉回世界 +Y
    const up = new CANNON.Vec3(0, 1, 0);
    const localUp = new CANNON.Vec3(0, 1, 0);
    const worldUp = new CANNON.Vec3();
    body.quaternion.vmult(localUp, worldUp);
    const torque = new CANNON.Vec3();
    worldUp.cross(up, torque);
    torque.scale(kP, torque);
    // 阻尼
    body.angularVelocity.x *= (1 - kD * 0.01);
    body.angularVelocity.z *= (1 - kD * 0.01);
    body.applyTorque(torque);
  }

  _applyYaw(body, targetYaw, kP) {
    // 简单 yaw 控制:计算当前 yaw 与目标差值,施加 y 轴扭矩
    const e = body.quaternion;
    const cur = Math.atan2(2 * (e.w * e.y + e.x * e.z), 1 - 2 * (e.y * e.y + e.x * e.x));
    let diff = targetYaw - cur;
    while (diff > Math.PI) diff -= Math.PI * 2;
    while (diff < -Math.PI) diff += Math.PI * 2;
    body.applyTorque(new CANNON.Vec3(0, diff * kP, 0));
    body.angularVelocity.y *= 0.85;
  }

  _doSwing() {
    // 给武器一个朝前下方的冲击速度
    const f = this.weapon.swingForce;
    const cosY = Math.cos(this.facing), sinY = Math.sin(this.facing);
    const fwd = new CANNON.Vec3(sinY, 0, cosY);
    const impulse = new CANNON.Vec3(fwd.x * f * 0.15, f * 0.05, fwd.z * f * 0.15);
    this.weaponBody.applyImpulse(impulse, new CANNON.Vec3(0, this.weapon.length / 2, 0));
    this.weaponBody.angularVelocity.x += -fwd.z * 12;
    this.weaponBody.angularVelocity.z += fwd.x * 12;
  }

  _maintainSwing(dt) {
    // 让武器尖端朝目标方向
    const cosY = Math.cos(this.facing), sinY = Math.sin(this.facing);
    const handPos = this.parts.larmR.body.position;
    const target = new CANNON.Vec3(
      handPos.x + sinY * 1.0,
      handPos.y + 0.5,
      handPos.z + cosY * 1.0,
    );
    const tipLocal = new CANNON.Vec3(0, this.weapon.length / 2, 0);
    const tipWorld = new CANNON.Vec3();
    this.weaponBody.pointToWorldFrame(tipLocal, tipWorld);
    const force = target.vsub(tipWorld).scale(this.weapon.returnForce);
    this.weaponBody.applyForce(force, tipWorld);
  }

  // 抓取(需求 7)
  tryGrab() {
    if (this.grabConstraint || this.dead) return;
    const handPart = this.parts.larmL.body; // 左手抓
    const handPos = handPart.position;
    const target = this.game.players[1 - this.index];
    if (!target || target.dead) return;
    let nearest = null, minDist = 1.2; // 最大抓取范围
    Object.values(target.parts).forEach(p => {
      const d = p.body.position.distanceTo(handPos);
      if (d < minDist) { minDist = d; nearest = p; }
    });
    if (nearest) {
      this.grabbedTarget = nearest;
      const localOnTarget = new CANNON.Vec3();
      const worldHand = new CANNON.Vec3(handPos.x, handPos.y, handPos.z);
      nearest.body.pointToLocalFrame(worldHand, localOnTarget);
      this.grabConstraint = new CANNON.PointToPointConstraint(
        handPart, new CANNON.Vec3(0, -0.15, 0),
        nearest.body, localOnTarget,
        200
      );
      this.game.world.addConstraint(this.grabConstraint);
      sfx.grunt();
    }
  }
  releaseGrab() {
    if (this.grabConstraint) {
      try { this.game.world.removeConstraint(this.grabConstraint); } catch (e) {}
      this.grabConstraint = null;
      this.grabbedTarget = null;
    }
  }

  takeDamage(amount, partType, hitPoint, sourceVel) {
    const now = performance.now();
    this.lastDamageByPart[partType] = this.lastDamageByPart[partType] || 0;
    if (now - this.lastDamageByPart[partType] < 220) return;
    this.lastDamageByPart[partType] = now;

    const mult = PART_MULT[partType] || 1.0;
    const dmg = amount * mult;
    this.hp = Math.max(0, this.hp - dmg);

    // 流血粒子
    const dir = sourceVel ? new THREE.Vector3(sourceVel.x, sourceVel.y, sourceVel.z).normalize() : new THREE.Vector3(0, 1, 0);
    this.game.blood.spawn(new THREE.Vector3(hitPoint.x, hitPoint.y, hitPoint.z), dir, 14, Math.min(2, dmg / 10));
    // 音效
    sfx.hit(Math.min(2, dmg / 15));
    sfx.grunt();
    // 红屏(只在自己被打时闪)
    if (this === game.players[myIndex]) flashBlood();

    // 击退
    if (hitPoint) {
      const part = Object.values(this.parts).find(p => p.partType === partType);
      if (part) {
        const push = new CANNON.Vec3(
          (part.body.position.x - hitPoint.x),
          0.5,
          (part.body.position.z - hitPoint.z)
        );
        push.normalize();
        push.scale(dmg * 0.3, push);
        part.body.applyImpulse(push, part.body.position);
      }
    }

    if (this.hp <= 0) this._die();
    updateHUD();
  }

  _die() {
    this.dead = true;
    // 解除握武器约束 → 武器掉落
    try { this.game.world.removeConstraint(this.gripConstraint); } catch (e) {}
    if (this.shieldConstraint) try { this.game.world.removeConstraint(this.shieldConstraint); } catch (e) {}
    if (this.grabConstraint) try { this.game.world.removeConstraint(this.grabConstraint); } catch (e) {}
    // 让所有部位自由翻滚
    this.bodies.forEach(b => { b.angularDamping = 0.2; });
  }

  syncMesh() {
    Object.values(this.parts).forEach(p => {
      p.mesh.position.copy(p.body.position);
      p.mesh.quaternion.copy(p.body.quaternion);
    });
    this.weaponMesh.position.copy(this.weaponBody.position);
    this.weaponMesh.quaternion.copy(this.weaponBody.quaternion);
    if (this.shieldMesh) {
      this.shieldMesh.position.copy(this.shieldBody.position);
      this.shieldMesh.quaternion.copy(this.shieldBody.quaternion);
    }
  }
}

// ==========================================================
// Game
// ==========================================================
class Game {
  constructor() {
    this.scene = new THREE.Scene();
    this.camera = new THREE.PerspectiveCamera(70, innerWidth / innerHeight, 0.1, 200);
    this.renderer = new THREE.WebGLRenderer({ antialias: true });
    this.renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    this.renderer.setSize(innerWidth, innerHeight);
    this.renderer.shadowMap.enabled = true;
    this.renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    this.renderer.toneMapping = THREE.ACESFilmicToneMapping;
    this.renderer.toneMappingExposure = 1.0;
    document.body.appendChild(this.renderer.domElement);
    addEventListener('resize', () => {
      this.camera.aspect = innerWidth / innerHeight;
      this.camera.updateProjectionMatrix();
      this.renderer.setSize(innerWidth, innerHeight);
    });

    // 光
    this.scene.add(new THREE.HemisphereLight(0xffd0a0, 0x201008, 0.45));
    const sun = new THREE.DirectionalLight(0xffe0b0, 0.9);
    sun.position.set(8, 16, 5);
    sun.castShadow = true;
    sun.shadow.mapSize.set(1024, 1024);
    sun.shadow.camera.left = -16; sun.shadow.camera.right = 16;
    sun.shadow.camera.top = 16; sun.shadow.camera.bottom = -16;
    this.scene.add(sun);

    // 物理世界
    this.world = new CANNON.World({ gravity: new CANNON.Vec3(0, -22, 0) });
    this.world.broadphase = new CANNON.SAPBroadphase(this.world);
    this.world.solver.iterations = 14;
    this.world.defaultContactMaterial.friction = 0.5;
    this.world.defaultContactMaterial.restitution = 0.05;

    buildArena(this.scene, this.world);

    this.players = [null, null];
    this.collisionEvents = [];
    this.world.addEventListener('beginContact', (ev) => {
      this.collisionEvents.push({ a: ev.bodyA, b: ev.bodyB });
    });

    this.blood = new BloodSystem(this.scene);
    this.lastTime = performance.now();
    this.acc = 0;
    this._cam = null;
  }

  spawn(weaponKeys) {
    this.players[0] = new Player(this, 0, 0xb04040, weaponKeys[0]);
    this.players[1] = new Player(this, 1, 0x4070b0, weaponKeys[1]);
  }
}

// 主流程

const $ = id => document.getElementById(id);
const game = new Game();
const net = new Net();
let myIndex = 0;
let started = false;
let pointerLocked = false;
let yaw = 0; // 我方角色 yaw
let camPitch = -0.2;

// 输入采集
const keys = {};
addEventListener('keydown', e => { keys[e.code] = true; if (e.code === 'Escape') document.exitPointerLock?.(); });
addEventListener('keyup', e => { keys[e.code] = false; });

let leftDown = false, rightDown = false;
addEventListener('mousedown', e => {
  if (!started) return;
  if (e.button === 0) leftDown = true;
  if (e.button === 2) {
    rightDown = true;
    // 立即尝试本地抓取(房主权威,所以非房主只是给本地视觉)
    if (net.isHost && myIndex === 0) game.players[0].tryGrab();
    else if (!net.isHost && myIndex === 1) game.players[1].tryGrab();
  }
});
addEventListener('mouseup', e => {
  if (e.button === 0) leftDown = false;
  if (e.button === 2) {
    rightDown = false;
    if (net.isHost && myIndex === 0) game.players[0].releaseGrab();
    else if (!net.isHost && myIndex === 1) game.players[1].releaseGrab();
  }
});
addEventListener('contextmenu', e => e.preventDefault());
addEventListener('mousemove', e => {
  if (!pointerLocked) return;
  yaw -= e.movementX * 0.0025;
  camPitch -= e.movementY * 0.0025;
  camPitch = Math.max(-0.7, Math.min(0.4, camPitch));
});

function lockPointer() {
  game.renderer.domElement.requestPointerLock?.();
}
document.addEventListener('pointerlockchange', () => {
  pointerLocked = document.pointerLockElement === game.renderer.domElement;
});
document.addEventListener('click', () => { if (started && !pointerLocked) lockPointer(); });

function flashBlood() {
  const el = $('blood-overlay');
  el.classList.add('hit');
  clearTimeout(flashBlood._t);
  flashBlood._t = setTimeout(() => el.classList.remove('hit'), 180);
}

function updateHUD() {
  const p1 = game.players[0], p2 = game.players[1];
  if (!p1 || !p2) return;
  $('p1-hp').style.width = (p1.hp / MAX_HP * 100) + '%';
  $('p2-hp').style.width = (p2.hp / MAX_HP * 100) + '%';
  $('p1-name').textContent = '红方斗士' + (myIndex === 0 ? ' (你)' : '');
  $('p2-name').textContent = '蓝方斗士' + (myIndex === 1 ? ' (你)' : '');
  $('p1-weapon').textContent = '武器:' + p1.weapon.name;
  $('p2-weapon').textContent = '武器:' + p2.weapon.name;
  if (p1.dead || p2.dead) {
    const meWin = (p1.dead && myIndex === 1) || (p2.dead && myIndex === 0);
    $('result-text').textContent = meWin ? 'VICTORY' : 'DEFEAT';
    $('result-text').style.color = meWin ? '#f0d890' : '#c04040';
    $('result').style.display = 'flex';
    document.exitPointerLock?.();
  }
}

function gatherInput() {
  let mvx = 0, mvz = 0;
  if (keys['KeyW']) mvz += 1;
  if (keys['KeyS']) mvz -= 1;
  if (keys['KeyA']) mvx -= 1;
  if (keys['KeyD']) mvx += 1;
  const len = Math.hypot(mvx, mvz);
  if (len > 0) { mvx /= len; mvz /= len; }
  return {
    mvx, mvz, yaw,
    jump: keys['Space'] ? 1 : 0,
    sprint: keys['ShiftLeft'] || keys['ShiftRight'] ? 1 : 0,
    swing: leftDown ? 1 : 0,
    grab: rightDown ? 1 : 0,
  };
}

// =========== 同步 ===========
function snapshot() {
  return {
    players: game.players.map(p => ({
      hp: p.hp, dead: p.dead, facing: p.facing,
      bodies: p.bodies.map(b => ({
        x: b.position.x, y: b.position.y, z: b.position.z,
        qx: b.quaternion.x, qy: b.quaternion.y, qz: b.quaternion.z, qw: b.quaternion.w,
        vx: b.velocity.x, vy: b.velocity.y, vz: b.velocity.z,
        avx: b.angularVelocity.x, avy: b.angularVelocity.y, avz: b.angularVelocity.z,
      })),
      weapon: {
        x: p.weaponBody.position.x, y: p.weaponBody.position.y, z: p.weaponBody.position.z,
        qx: p.weaponBody.quaternion.x, qy: p.weaponBody.quaternion.y, qz: p.weaponBody.quaternion.z, qw: p.weaponBody.quaternion.w,
        vx: p.weaponBody.velocity.x, vy: p.weaponBody.velocity.y, vz: p.weaponBody.velocity.z,
        avx: p.weaponBody.angularVelocity.x, avy: p.weaponBody.angularVelocity.y, avz: p.weaponBody.angularVelocity.z,
      },
      shield: p.shieldBody ? {
        x: p.shieldBody.position.x, y: p.shieldBody.position.y, z: p.shieldBody.position.z,
        qx: p.shieldBody.quaternion.x, qy: p.shieldBody.quaternion.y, qz: p.shieldBody.quaternion.z, qw: p.shieldBody.quaternion.w,
      } : null,
    })),
  };
}
function applySnap(s) {
  s.players.forEach((ps, i) => {
    const p = game.players[i]; if (!p) return;
    p.hp = ps.hp; p.facing = ps.facing;
    if (ps.dead && !p.dead) p._die();
    ps.bodies.forEach((bs, j) => {
      const b = p.bodies[j]; if (!b) return;
      b.position.set(bs.x, bs.y, bs.z);
      b.quaternion.set(bs.qx, bs.qy, bs.qz, bs.qw);
      b.velocity.set(bs.vx, bs.vy, bs.vz);
      b.angularVelocity.set(bs.avx, bs.avy, bs.avz);
    });
    p.weaponBody.position.set(ps.weapon.x, ps.weapon.y, ps.weapon.z);
    p.weaponBody.quaternion.set(ps.weapon.qx, ps.weapon.qy, ps.weapon.qz, ps.weapon.qw);
    p.weaponBody.velocity.set(ps.weapon.vx, ps.weapon.vy, ps.weapon.vz);
    p.weaponBody.angularVelocity.set(ps.weapon.avx, ps.weapon.avy, ps.weapon.avz);
    if (p.shieldBody && ps.shield) {
      p.shieldBody.position.set(ps.shield.x, ps.shield.y, ps.shield.z);
      p.shieldBody.quaternion.set(ps.shield.qx, ps.shield.qy, ps.shield.qz, ps.shield.qw);
    }
  });
  updateHUD();
}

net.onData = msg => {
  if (!msg) return;
  if (msg.t === 'init') {
    // 房主 → 访客:武器分配
    pendingInit = msg.d;
    if (!started) tryStart();
  } else if (msg.t === 'input') {
    const p = game.players[1]; if (!p) return;
    const prevGrab = p.input.grab;
    p.input = msg.d;
    if (msg.d.grab && !prevGrab) p.tryGrab();
    if (!msg.d.grab && prevGrab) p.releaseGrab();
  } else if (msg.t === 'state') {
    applySnap(msg.d);
  } else if (msg.t === 'fx') {
    // 命中特效广播(简化:伤害已包含在 state 里,这里不必再做)
  }
};

let pendingInit = null;
function tryStart() {
  if (started || !pendingInit) return;
  started = true;
  game.spawn(pendingInit.weapons);
  $('lobby').classList.add('hidden');
  $('hud').classList.remove('hidden');
  $('tips').classList.remove('hidden');
  $('crosshair').classList.remove('hidden');
  updateHUD();
  setTimeout(() => lockPointer(), 200);
  requestAnimationFrame(loop);
}

// =========== 伤害判定(房主权威) ===========
function processCollisions() {
  for (const ev of game.collisionEvents) {
    const ua = ev.a.userData, ub = ev.b.userData;
    if (!ua || !ub) continue;
    let weapon = null, victim = null, victimBody = null;
    if (ua.type === 'weapon' && ub.type === 'part') { weapon = ua.player; victim = ub.player; victimBody = ev.b; }
    else if (ub.type === 'weapon' && ua.type === 'part') { weapon = ub.player; victim = ua.player; victimBody = ev.a; }
    if (!weapon || !victim || weapon === victim) continue;

    const v = weapon.weaponBody.velocity;
    const av = weapon.weaponBody.angularVelocity;
    const speed = Math.hypot(v.x, v.y, v.z) + Math.hypot(av.x, av.y, av.z) * 0.5;
    if (speed < 4) continue;
    const partType = victimBody.userData.partType;
    const baseDmg = Math.min(60, Math.max(6, speed * 2.8 * weapon.weapon.dmgMult));
    victim.takeDamage(baseDmg, partType, weapon.weaponBody.position, v);
  }
  game.collisionEvents.length = 0;
}

// =========== 主循环 ===========
function loop() {
  requestAnimationFrame(loop);
  const now = performance.now();
  let dt = (now - game.lastTime) / 1000;
  game.lastTime = now;
  if (dt > 0.1) dt = 0.1;
  game.acc += dt;

  const localInput = gatherInput();
  const localP = game.players[myIndex];
  if (localP) {
    if (net.isHost) {
      localP.input = localInput;
    } else {
      const prev = localP.input.grab;
      localP.input = localInput;
      if (localInput.grab && !prev) localP.tryGrab();
      if (!localInput.grab && prev) localP.releaseGrab();
      net.send({ t: 'input', d: localInput });
    }
  }

  while (game.acc >= FIXED_DT) {
    game.acc -= FIXED_DT;
    if (net.isHost) {
      game.players.forEach(p => p.applyInput(FIXED_DT));
      game.world.step(FIXED_DT);
      processCollisions();
    } else {
      // 访客只本地预测(不做权威伤害)
      game.players.forEach(p => p.applyInput(FIXED_DT));
      game.world.step(FIXED_DT);
      game.collisionEvents.length = 0;
    }
  }

  // 房主广播
  game._sendAcc = (game._sendAcc || 0) + dt;
  if (net.isHost && game._sendAcc >= 1 / 25) {
    game._sendAcc = 0;
    net.send({ t: 'state', d: snapshot() });
  }

  // 渲染同步
  game.players.forEach(p => p.syncMesh());
  game.blood.update(dt);

  // 摄像机 — 第三人称(需求 1)
  const me = game.players[myIndex];
  if (me) {
    const head = me.parts.head.body.position;
    const dist = 3.6, height = 1.6;
    const cosY = Math.cos(yaw), sinY = Math.sin(yaw);
    const targetPos = new THREE.Vector3(
      head.x - sinY * dist,
      head.y + height + camPitch * 2,
      head.z - cosY * dist,
    );
    if (!game._cam) game._cam = targetPos.clone();
    game._cam.lerp(targetPos, 0.15);
    game.camera.position.copy(game._cam);
    const lookAt = new THREE.Vector3(head.x + sinY * 2, head.y + camPitch * 2, head.z + cosY * 2);
    game.camera.lookAt(lookAt);
  }

  game.renderer.render(game.scene, game.camera);
}

// =========== 大厅 UI ===========
function buildShareLink(roomId) {
  const url = new URL(location.href);
  url.hash = '#room=' + roomId;
  return url.toString();
}
function parseRoom(text) {
  text = text.trim(); if (!text) return null;
  const m = text.match(/room=([\w-]+)/);
  if (m) return m[1];
  return text;
}
function pickWeapons() {
  const k1 = WEAPON_KEYS[Math.floor(Math.random() * WEAPON_KEYS.length)];
  const k2 = WEAPON_KEYS[Math.floor(Math.random() * WEAPON_KEYS.length)];
  return [k1, k2];
}

  } catch (e) {
    $('home-status').innerHTML = `<span style="color:#e06060">无法访问信令服务器:${getFirebaseURL()}<br>请点击下方"⚙ 配置 Firebase 信令"创建你自己的免费项目并填入</span>`;

$('btn-join').addEventListener('click', async () => {

        </ul>
        <br>
        <button onclick="location.reload()" style="width:auto;padding:6px 16px">返回重试</button>
      </div>`;
  }
}
// 配置 Firebase 入口
$('btn-cfg').addEventListener('click', (e) => {
  e.preventDefault();
  $('home-view').classList.add('hidden');
  $('cfg-view').classList.remove('hidden');
  $('cfg-url').value = getFirebaseURL();
});
$('btn-cfg-back').addEventListener('click', () => {
  $('cfg-view').classList.add('hidden');
  $('home-view').classList.remove('hidden');
});
$('btn-cfg-save').addEventListener('click', () => {
  const v = $('cfg-url').value.trim();
  if (v && v.startsWith('http')) {
    localStorage.setItem('blade_duel_fb_url', v);
    alert('已保存!现在可以创建房间了');
    $('cfg-view').classList.add('hidden');
    $('home-view').classList.remove('hidden');
  } else {
    alert('请输入有效的 https://xxx 链接');
  }
});

(function autoJoin() {
  const m = location.hash.match(/[#&]room=([\w-]+)/);
  if (m) setTimeout(() => joinRoom(m[1]), 300);
})();

</script>
