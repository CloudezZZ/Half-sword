<script type="importmap">
{
  "imports": {

<script type="module">
// Blade Duel — 双人剑斗对战
// Three.js 渲染 + Cannon-es 物理 + PeerJS WebRTC 同步
import * as THREE from 'three';
import * as CANNON from 'cannon-es';

// ==========================================================
// 常量
// ==========================================================
const ARENA_SIZE = 20;
const FIXED_DT = 1 / 60;
const MAX_HP = 100;

// ==========================================================
// 网络层（PeerJS 信令 + WebRTC DataChannel）
// ==========================================================
class Net {
  constructor() {
    this.peer = null;
    this.conn = null;
    this.isHost = false;
    this.onOpen = () => {};
    this.onData = () => {};
    this.onClose = () => {};
  }
  _peerConfig() {
    // 公共 STUN + 免费 TURN(metered.ca 公开服务),保证跨 NAT / 跨运营商可达
    return {
      debug: 1,
      config: {
        iceServers: [
          { urls: 'stun:stun.l.google.com:19302' },
          { urls: 'stun:stun1.l.google.com:19302' },
          { urls: 'stun:global.stun.twilio.com:3478' },
          {
            urls: 'turn:openrelay.metered.ca:80',
            username: 'openrelayproject',
            credential: 'openrelayproject',
          },
          {
            urls: 'turn:openrelay.metered.ca:443',
            username: 'openrelayproject',
            credential: 'openrelayproject',
          },
          {
            urls: 'turn:openrelay.metered.ca:443?transport=tcp',
            username: 'openrelayproject',
            credential: 'openrelayproject',
          },
        ],
      },
    };
  }
  async host() {
    this.isHost = true;
    return new Promise((resolve, reject) => {
      const id = 'bd-' + Math.random().toString(36).slice(2, 8);
      this.peer = new Peer(id, this._peerConfig());
      this.peer.on('open', (peerId) => resolve(peerId));
      this.peer.on('connection', (conn) => {
        this.conn = conn;
        conn.on('open', () => this.onOpen());
        conn.on('data', (d) => this.onData(d));
        conn.on('close', () => this.onClose());
      });
      this.peer.on('error', (e) => {
        console.warn('Peer error', e);
        if (e.type === 'unavailable-id' || e.type === 'network' || e.type === 'server-error') reject(e);
      });
    });
  }
  async join(hostId) {
    this.isHost = false;
    return new Promise((resolve, reject) => {
      this.peer = new Peer(this._peerConfig());
      let opened = false;
      this.peer.on('open', () => {
        const conn = this.peer.connect(hostId, { reliable: false });
        this.conn = conn;
        const timer = setTimeout(() => {
          if (!opened) reject(new Error('连接超时,房主未响应'));
        }, 15000);
        conn.on('open', () => { opened = true; clearTimeout(timer); this.onOpen(); resolve(); });
        conn.on('data', (d) => this.onData(d));
        conn.on('close', () => this.onClose());
        conn.on('error', (e) => { clearTimeout(timer); reject(e); });
      });
      this.peer.on('error', (e) => reject(e));
    });
  }
  send(obj) {
    if (this.conn && this.conn.open) {
      try { this.conn.send(obj); } catch (e) {}
    }
  }
}

// ==========================================================
// 物理 + 渲染 世界
// ==========================================================
class Game {
  constructor() {
    this.scene = new THREE.Scene();
    this.scene.background = new THREE.Color(0x1a2030);
    this.scene.fog = new THREE.Fog(0x1a2030, 15, 50);

    this.camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 200);
    this.camera.position.set(0, 8, 14);
    this.camera.lookAt(0, 1, 0);

    this.renderer = new THREE.WebGLRenderer({ antialias: true });
    this.renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    this.renderer.setSize(innerWidth, innerHeight);
    this.renderer.shadowMap.enabled = true;
    this.renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.body.appendChild(this.renderer.domElement);

    addEventListener('resize', () => {
      this.camera.aspect = innerWidth / innerHeight;
      this.camera.updateProjectionMatrix();
      this.renderer.setSize(innerWidth, innerHeight);
    });

    // 光照
    const hemi = new THREE.HemisphereLight(0xb0c8ff, 0x202830, 0.6);
    this.scene.add(hemi);
    const dir = new THREE.DirectionalLight(0xffe8c0, 1.0);
    dir.position.set(8, 14, 6);
    dir.castShadow = true;
    dir.shadow.mapSize.set(1024, 1024);
    dir.shadow.camera.left = -15; dir.shadow.camera.right = 15;
    dir.shadow.camera.top = 15; dir.shadow.camera.bottom = -15;
    this.scene.add(dir);

    // 物理世界
    this.world = new CANNON.World({ gravity: new CANNON.Vec3(0, -20, 0) });
    this.world.broadphase = new CANNON.SAPBroadphase(this.world);
    this.world.solver.iterations = 12;
    this.world.defaultContactMaterial.friction = 0.4;
    this.world.defaultContactMaterial.restitution = 0.1;

    this.buildArena();

    this.players = [null, null]; // 0: 红, 1: 蓝
    this.collisionEvents = [];
    this.world.addEventListener('beginContact', (ev) => {
      this.collisionEvents.push({ a: ev.bodyA, b: ev.bodyB, contact: ev.contact });
    });

    this.localIndex = 0; // 我是哪一方
    this.acc = 0;
    this.lastTime = performance.now();
  }

  buildArena() {
    // 地面
    const groundMat = new THREE.MeshStandardMaterial({ color: 0x3a4050, roughness: 0.9 });
    const groundGeo = new THREE.CircleGeometry(ARENA_SIZE / 2, 64);
    const ground = new THREE.Mesh(groundGeo, groundMat);
    ground.rotation.x = -Math.PI / 2;
    ground.receiveShadow = true;
    this.scene.add(ground);

    // 网格纹理
    const grid = new THREE.GridHelper(ARENA_SIZE, 20, 0x4a5468, 0x2a3040);
    grid.position.y = 0.01;
    this.scene.add(grid);

    // 物理地面
    const groundBody = new CANNON.Body({ mass: 0, shape: new CANNON.Plane() });
    groundBody.quaternion.setFromAxisAngle(new CANNON.Vec3(1, 0, 0), -Math.PI / 2);
    groundBody.userData = { type: 'ground' };
    this.world.addBody(groundBody);

    // 围栏（不可见墙）
    const wallShape = new CANNON.Box(new CANNON.Vec3(ARENA_SIZE / 2, 3, 0.5));
    const positions = [
      [0, 3, ARENA_SIZE / 2], [0, 3, -ARENA_SIZE / 2],
    ];
    positions.forEach((p) => {
      const b = new CANNON.Body({ mass: 0, shape: wallShape });
      b.position.set(...p);
      this.world.addBody(b);
    });
    const wallShape2 = new CANNON.Box(new CANNON.Vec3(0.5, 3, ARENA_SIZE / 2));
    [[ARENA_SIZE / 2, 3, 0], [-ARENA_SIZE / 2, 3, 0]].forEach((p) => {
      const b = new CANNON.Body({ mass: 0, shape: wallShape2 });
      b.position.set(...p);
      this.world.addBody(b);
    });

    // 装饰柱
    for (let i = 0; i < 8; i++) {
      const a = (i / 8) * Math.PI * 2;
      const r = ARENA_SIZE / 2 - 0.3;
      const px = Math.cos(a) * r, pz = Math.sin(a) * r;
      const torch = new THREE.Mesh(
        new THREE.CylinderGeometry(0.12, 0.12, 2.4),
        new THREE.MeshStandardMaterial({ color: 0x4a3020 })
      );
      torch.position.set(px, 1.2, pz);
      torch.castShadow = true;
      this.scene.add(torch);
      const fire = new THREE.PointLight(0xff8030, 1.2, 8);
      fire.position.set(px, 2.5, pz);
      this.scene.add(fire);
      const ball = new THREE.Mesh(
        new THREE.SphereGeometry(0.18, 12, 12),
        new THREE.MeshBasicMaterial({ color: 0xffaa40 })
      );
      ball.position.copy(fire.position);
      this.scene.add(ball);
    }
  }

  spawnPlayer(index, color) {
    const p = new Player(this, index, color);
    this.players[index] = p;
    return p;
  }
}

// ==========================================================
// 玩家（简化 ragdoll：身体 + 手臂 + 武器）
// ==========================================================
class Player {
  constructor(game, index, color) {
    this.game = game;
    this.index = index;
    this.color = color;
    this.hp = MAX_HP;
    this.dead = false;

    const startX = index === 0 ? -4 : 4;
    const facing = index === 0 ? 1 : -1;

    // 身体（胶囊近似：球+圆柱+球）
    const bodyMat = new THREE.MeshStandardMaterial({ color, roughness: 0.6, metalness: 0.2 });
    this.bodyMesh = new THREE.Group();
    const torso = new THREE.Mesh(new THREE.CapsuleGeometry(0.45, 1.0, 8, 16), bodyMat);
    torso.castShadow = true;
    this.bodyMesh.add(torso);
    const head = new THREE.Mesh(
      new THREE.SphereGeometry(0.32, 16, 16),
      new THREE.MeshStandardMaterial({ color: 0xf0d090 })
    );
    head.position.y = 1.0;
    head.castShadow = true;
    this.bodyMesh.add(head);
    // 简易脸
    const eyeMat = new THREE.MeshBasicMaterial({ color: 0x000 });
    const eyeL = new THREE.Mesh(new THREE.SphereGeometry(0.04), eyeMat);
    const eyeR = eyeL.clone();
    eyeL.position.set(-0.1, 1.05, 0.28); eyeR.position.set(0.1, 1.05, 0.28);
    this.bodyMesh.add(eyeL, eyeR);
    game.scene.add(this.bodyMesh);

    // 物理身体
    this.body = new CANNON.Body({
      mass: 5,
      shape: new CANNON.Sphere(0.6),
      position: new CANNON.Vec3(startX, 1.2, 0),
      linearDamping: 0.5,
      angularDamping: 0.9,
    });
    this.body.fixedRotation = true;
    this.body.updateMassProperties();
    this.body.userData = { type: 'player', player: this };
    game.world.addBody(this.body);

    // 武器（剑）— 物理刚体由"手"持
    const swordLen = 1.4;
    this.swordLen = swordLen;
    const swordGeo = new THREE.Group();
    const blade = new THREE.Mesh(
      new THREE.BoxGeometry(0.06, swordLen, 0.18),
      new THREE.MeshStandardMaterial({ color: 0xdde4ee, metalness: 0.9, roughness: 0.2 })
    );
    blade.position.y = swordLen / 2 + 0.1;
    blade.castShadow = true;
    const guard = new THREE.Mesh(
      new THREE.BoxGeometry(0.32, 0.06, 0.1),
      new THREE.MeshStandardMaterial({ color: 0x806030 })
    );
    guard.position.y = 0.1;
    const grip = new THREE.Mesh(
      new THREE.CylinderGeometry(0.05, 0.05, 0.25),
      new THREE.MeshStandardMaterial({ color: 0x402010 })
    );
    grip.position.y = -0.05;
    swordGeo.add(blade, guard, grip);
    this.swordMesh = swordGeo;
    game.scene.add(this.swordMesh);

    this.swordBody = new CANNON.Body({
      mass: 1.2,
      shape: new CANNON.Box(new CANNON.Vec3(0.05, swordLen / 2, 0.1)),
      linearDamping: 0.1,
      angularDamping: 0.2,
    });
    this.swordBody.userData = { type: 'sword', player: this };
    this.swordBody.position.set(startX + 0.6 * facing, 1.4, 0);
    game.world.addBody(this.swordBody);

    // 用 PointToPoint 约束模拟"手握剑"
    this.handAnchor = new CANNON.Vec3(0.5 * facing, 0.2, 0); // 相对身体的"手"位置
    this.swordGripLocal = new CANNON.Vec3(0, -swordLen / 2, 0); // 相对剑的握把
    this.gripConstraint = new CANNON.PointToPointConstraint(
      this.body, this.handAnchor,
      this.swordBody, this.swordGripLocal,
      40 // 最大力，砍到硬物会脱手
    );
    game.world.addConstraint(this.gripConstraint);

    // 输入状态（远端通过网络更新）
    this.input = { mx: 0, my: 0, mvx: 0, mvz: 0, jump: 0, sprint: 0, swing: 0, swingDX: 0, swingDY: 0 };
    this.swingTimer = 0;
    this.swingTarget = new CANNON.Vec3();
    this.lastDamageTime = 0;
  }

  applyInput(dt) {
    if (this.dead) return;
    const speed = this.input.sprint ? 7 : 4;
    const v = this.body.velocity;
    v.x = this.input.mvx * speed;
    v.z = this.input.mvz * speed;
    if (this.input.jump && Math.abs(v.y) < 0.05) {
      v.y = 8;
      this.input.jump = 0;
    }
    // 朝向
    const facing = this.index === 0 ? 1 : -1;
    // 让身体始终面向另一方
    const other = this.game.players[1 - this.index];
    if (other) {
      const dx = other.body.position.x - this.body.position.x;
      const dz = other.body.position.z - this.body.position.z;
      this.bodyFacing = Math.atan2(dx, dz);
    }

    // 剑挥动：根据鼠标增量给剑施加扭矩 + 拉力
    if (this.input.swing) {
      const handWorld = new CANNON.Vec3();
      this.body.pointToWorldFrame(this.handAnchor, handWorld);
      // 目标点：手前方一段距离 + 鼠标偏移
      const forward = new CANNON.Vec3(Math.sin(this.bodyFacing || 0), 0, Math.cos(this.bodyFacing || 0));
      const right = new CANNON.Vec3(forward.z, 0, -forward.x);
      const target = handWorld.vadd(forward.scale(1.2));
      target.y += 1.0 - this.input.swingDY * 1.5; // 鼠标 Y 控制高低
      target.vadd(right.scale(this.input.swingDX * 1.5), target);

      // 把剑尖往 target 拉
      const tipLocal = new CANNON.Vec3(0, this.swordLen / 2, 0);
      const tipWorld = new CANNON.Vec3();
      this.swordBody.pointToWorldFrame(tipLocal, tipWorld);
      const force = target.vsub(tipWorld).scale(80);
      this.swordBody.applyForce(force, tipWorld);
    } else {
      // 还原姿势
      const handWorld = new CANNON.Vec3();
      this.body.pointToWorldFrame(this.handAnchor, handWorld);
      const target = handWorld.clone();
      target.y += 0.6;
      const tipLocal = new CANNON.Vec3(0, this.swordLen / 2, 0);
      const tipWorld = new CANNON.Vec3();
      this.swordBody.pointToWorldFrame(tipLocal, tipWorld);
      const force = target.vsub(tipWorld).scale(15);
      this.swordBody.applyForce(force, tipWorld);
    }
  }

  syncMesh() {
    this.bodyMesh.position.copy(this.body.position);
    if (this.bodyFacing !== undefined) this.bodyMesh.rotation.y = this.bodyFacing;
    this.swordMesh.position.copy(this.swordBody.position);
    this.swordMesh.quaternion.copy(this.swordBody.quaternion);
  }

  takeDamage(amount, hitPoint) {
    const now = performance.now();
    if (now - this.lastDamageTime < 250) return; // 冷却避免连帧
    this.lastDamageTime = now;
    this.hp = Math.max(0, this.hp - amount);
    // 击退
    if (hitPoint) {
      const dir = this.body.position.vsub(hitPoint);
      dir.y = 0; dir.normalize();
      this.body.velocity.x += dir.x * 4;
      this.body.velocity.z += dir.z * 4;
      this.body.velocity.y += 2;
    }
    if (this.hp <= 0) {
      this.dead = true;
      // 倒下：解除握剑
      try { this.game.world.removeConstraint(this.gripConstraint); } catch (e) {}
      this.body.fixedRotation = false;
      this.body.updateMassProperties();
      this.body.angularVelocity.set(Math.random() * 4, 0, Math.random() * 4);
    }
    updateHUD();
  }
}

// ==========================================================
// 全局
// ==========================================================
const game = new Game();
const net = new Net();
let myIndex = 0; // 0 = 房主红方, 1 = 访客蓝方
let gameStarted = false;

// 创建两个玩家
game.spawnPlayer(0, 0xc04040);
game.spawnPlayer(1, 0x4080d0);

// ==========================================================
// 输入采集（仅本地玩家）
// ==========================================================
const keys = {};
addEventListener('keydown', (e) => { keys[e.code] = true; });
addEventListener('keyup', (e) => { keys[e.code] = false; });

let mouseDown = false, lastMX = 0, lastMY = 0, swingDX = 0, swingDY = 0;
addEventListener('mousedown', (e) => {
  if (e.button === 0) { mouseDown = true; lastMX = e.clientX; lastMY = e.clientY; }
});
addEventListener('mouseup', (e) => {
  if (e.button === 0) { mouseDown = false; swingDX = 0; swingDY = 0; }
});
addEventListener('mousemove', (e) => {
  if (mouseDown) {
    swingDX = (e.clientX - innerWidth / 2) / (innerWidth / 2);
    swingDY = (e.clientY - innerHeight / 2) / (innerHeight / 2);
  }
});

function gatherLocalInput() {
  const me = game.players[myIndex];
  if (!me) return null;
  let mvx = 0, mvz = 0;
  // 视角是固定俯视的，所以 WASD 是世界坐标
  if (keys['KeyW']) mvz -= 1;
  if (keys['KeyS']) mvz += 1;
  if (keys['KeyA']) mvx -= 1;
  if (keys['KeyD']) mvx += 1;
  // 蓝方反转方向以匹配视角
  if (myIndex === 1) { mvx = -mvx; mvz = -mvz; }
  const len = Math.hypot(mvx, mvz);
  if (len > 0) { mvx /= len; mvz /= len; }
  return {
    mvx, mvz,
    jump: keys['Space'] ? 1 : 0,
    sprint: keys['ShiftLeft'] || keys['ShiftRight'] ? 1 : 0,
    swing: mouseDown ? 1 : 0,
    swingDX: myIndex === 1 ? -swingDX : swingDX,
    swingDY,
  };
}

// ==========================================================
// 同步协议
// 房主权威：物理在房主跑，访客发送 input，房主广播 state
// ==========================================================
function startGame() {
  if (gameStarted) return;
  gameStarted = true;
  document.getElementById('lobby').classList.add('hidden');
  document.getElementById('hud').classList.remove('hidden');
  document.getElementById('tips').classList.remove('hidden');
  updateHUD();
  requestAnimationFrame(loop);
}

function updateHUD() {
  const p1 = game.players[0], p2 = game.players[1];
  document.getElementById('p1-hp').style.width = (p1.hp / MAX_HP * 100) + '%';
  document.getElementById('p2-hp').style.width = (p2.hp / MAX_HP * 100) + '%';
  document.getElementById('p1-name').textContent = '红方' + (myIndex === 0 ? ' (你)' : '');
  document.getElementById('p2-name').textContent = '蓝方' + (myIndex === 1 ? ' (你)' : '');

  if (p1.dead || p2.dead) {
    const win = p1.dead ? '蓝方' : '红方';
    const meWin = (p1.dead && myIndex === 1) || (p2.dead && myIndex === 0);
    document.getElementById('result-text').textContent = meWin ? 'VICTORY' : 'DEFEAT';
    document.getElementById('result-text').style.color = meWin ? '#f0d890' : '#c04040';
    document.getElementById('result').style.display = 'flex';
  }
}

net.onData = (msg) => {
  if (!msg) return;
  if (msg.t === 'input') {
    // 房主收到访客输入
    const p = game.players[1];
    if (p) p.input = msg.d;
  } else if (msg.t === 'state') {
    // 访客收到房主权威状态
    applyAuthState(msg.d);
  }
};

function applyAuthState(s) {
  for (let i = 0; i < 2; i++) {
    const p = game.players[i];
    const ps = s.players[i];
    p.body.position.set(ps.bx, ps.by, ps.bz);
    p.body.velocity.set(ps.bvx, ps.bvy, ps.bvz);
    p.body.quaternion.set(ps.bqx, ps.bqy, ps.bqz, ps.bqw);
    p.swordBody.position.set(ps.sx, ps.sy, ps.sz);
    p.swordBody.quaternion.set(ps.sqx, ps.sqy, ps.sqz, ps.sqw);
    p.swordBody.velocity.set(ps.svx, ps.svy, ps.svz);
    p.swordBody.angularVelocity.set(ps.savx, ps.savy, ps.savz);
    p.bodyFacing = ps.f;
    if (p.hp !== ps.hp) {
      p.hp = ps.hp;
      if (ps.hp <= 0 && !p.dead) {
        p.dead = true;
        try { game.world.removeConstraint(p.gripConstraint); } catch (e) {}
        p.body.fixedRotation = false;
        p.body.updateMassProperties();
      }
    }
  }
  updateHUD();
}

function snapshotState() {
  const players = game.players.map(p => ({
    bx: p.body.position.x, by: p.body.position.y, bz: p.body.position.z,
    bvx: p.body.velocity.x, bvy: p.body.velocity.y, bvz: p.body.velocity.z,
    bqx: p.body.quaternion.x, bqy: p.body.quaternion.y, bqz: p.body.quaternion.z, bqw: p.body.quaternion.w,
    sx: p.swordBody.position.x, sy: p.swordBody.position.y, sz: p.swordBody.position.z,
    sqx: p.swordBody.quaternion.x, sqy: p.swordBody.quaternion.y, sqz: p.swordBody.quaternion.z, sqw: p.swordBody.quaternion.w,
    svx: p.swordBody.velocity.x, svy: p.swordBody.velocity.y, svz: p.swordBody.velocity.z,
    savx: p.swordBody.angularVelocity.x, savy: p.swordBody.angularVelocity.y, savz: p.swordBody.angularVelocity.z,
    f: p.bodyFacing || 0,
    hp: p.hp,
  }));
  return { players };
}

// ==========================================================
// 主循环
// ==========================================================
let stateSendTimer = 0;
function loop() {
  requestAnimationFrame(loop);
  const now = performance.now();
  let dt = (now - game.lastTime) / 1000;
  game.lastTime = now;
  if (dt > 0.1) dt = 0.1;
  game.acc += dt;

  // 本地输入
  const localInput = gatherLocalInput();
  if (localInput) {
    if (net.isHost) {
      game.players[0].input = localInput;
    } else {
      game.players[1].input = localInput;
      // 访客把输入发给房主
      net.send({ t: 'input', d: localInput });
    }
  }

  while (game.acc >= FIXED_DT) {
    game.acc -= FIXED_DT;
    if (net.isHost) {
      // 权威物理
      game.players.forEach(p => p.applyInput(FIXED_DT));
      game.world.step(FIXED_DT);
      processCollisions();
    } else {
      // 访客只跑插值/本地输入响应（不跑物理，等服务器同步）
      // 这里仍然跑一次以便剑剑碰撞视觉响应，但不发权威伤害
      game.players.forEach(p => p.applyInput(FIXED_DT));
      game.world.step(FIXED_DT);
    }
  }

  // 主权威广播
  if (net.isHost) {
    stateSendTimer += dt;
    if (stateSendTimer >= 1 / 30) {
      stateSendTimer = 0;
      net.send({ t: 'state', d: snapshotState() });
    }
  }

  // 同步可视
  game.players.forEach(p => p.syncMesh());

  // 摄像机跟随中点
  const a = game.players[0].body.position, b = game.players[1].body.position;
  const cx = (a.x + b.x) / 2, cz = (a.z + b.z) / 2;
  const dist = Math.max(8, Math.hypot(a.x - b.x, a.z - b.z) + 6);
  const sideSign = myIndex === 0 ? 1 : -1;
  if (!loop._cam) loop._cam = { x: cx, z: cz + dist * sideSign, h: dist * 0.5 };
  const cam = loop._cam;
  const tcx = cx, tcz = cz + dist * 0.7 * sideSign, th = dist * 0.55 + 2;
  cam.x += (tcx - cam.x) * 0.05;
  cam.z += (tcz - cam.z) * 0.05;
  cam.h += (th - cam.h) * 0.05;
  game.camera.position.set(cam.x, cam.h, cam.z);
  game.camera.lookAt(cx, 1, cz);

  game.renderer.render(game.scene, game.camera);
}

function processCollisions() {
  for (const ev of game.collisionEvents) {
    const ua = ev.a.userData, ub = ev.b.userData;
    if (!ua || !ub) continue;
    let sword = null, victim = null;
    if (ua.type === 'sword' && ub.type === 'player') { sword = ua.player; victim = ub.player; }
    else if (ub.type === 'sword' && ua.type === 'player') { sword = ub.player; victim = ua.player; }
    if (sword && victim && sword !== victim) {
      // 用剑速度计算伤害
      const v = sword.swordBody.velocity;
      const av = sword.swordBody.angularVelocity;
      const speed = Math.hypot(v.x, v.y, v.z) + Math.hypot(av.x, av.y, av.z) * 0.5;
      if (speed > 4) {
        const dmg = Math.min(40, Math.max(5, speed * 2.5));
        const hit = sword.swordBody.position;
        victim.takeDamage(dmg, hit);
      }
    }
  }
  game.collisionEvents.length = 0;
}

// ==========================================================
// 大厅 UI
// ==========================================================
const $ = (id) => document.getElementById(id);

function buildShareLink(roomId) {
  const url = new URL(location.href);
  url.hash = '#room=' + roomId;
  return url.toString();
}

function parseRoomFromInput(text) {
  text = text.trim();
  if (!text) return null;
  const m = text.match(/room=([\w-]+)/);
  if (m) return m[1];
  if (/^bd-[\w-]+$/.test(text)) return text;
  return text;
}

$('btn-host').addEventListener('click', async () => {
  $('home-view').classList.add('hidden');
  $('host-view').classList.remove('hidden');
  try {
    $('host-status').textContent = '正在连接信令服务器...';
    const id = await net.host();
    const link = buildShareLink(id);
    $('share-link').textContent = link;
    $('share-link').onclick = () => {
      navigator.clipboard.writeText(link).then(() => {
        $('host-status').textContent = '链接已复制!等待对方加入...';
      });
    };
    $('host-status').textContent = '房间已就绪,把链接发给朋友即可开战';
    net.onOpen = () => {
      $('host-status').textContent = '玩家已加入,开始游戏!';
      myIndex = 0;
      setTimeout(startGame, 400);
    };
    net.onClose = () => {
      $('host-status').textContent = '对方掉线了';
    };
  } catch (e) {
    $('host-status').textContent = '创建失败: ' + (e.message || e.type || e);
  }
});

$('btn-cancel-host').addEventListener('click', () => {
  if (net.peer) net.peer.destroy();
  location.reload();
});

$('btn-join').addEventListener('click', async () => {
  const id = parseRoomFromInput($('join-input').value);
  if (!id) { $('home-status').textContent = '请输入房间链接或 ID'; return; }
  await joinRoom(id);
});

async function joinRoom(id) {
  $('home-view').classList.add('hidden');
  $('join-view').classList.remove('hidden');
  $('join-status').textContent = '正在连接 ' + id + ' ...';
  try {
    net.onOpen = () => {
      $('join-status').textContent = '连接成功!';
      myIndex = 1;
      setTimeout(startGame, 400);
    };
    net.onClose = () => {
      $('join-status').textContent = '连接断开';
    };
    await net.join(id);
  } catch (e) {
    const msg = e.type === 'peer-unavailable'
      ? '房间不存在或房主已离开,请确认链接正确'
      : (e.message || e.type || '未知错误');
    $('join-status').innerHTML = '连接失败: ' + msg + '<br><br><button onclick="location.reload()" style="width:auto;padding:6px 16px">返回</button>';
  }
}

// 自动从 URL 加入
(function autoJoin() {
  const m = location.hash.match(/room=([\w-]+)/);
  if (m) {
    setTimeout(() => joinRoom(m[1]), 300);
  }
})();
